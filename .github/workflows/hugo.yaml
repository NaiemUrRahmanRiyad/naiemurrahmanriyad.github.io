name: Build and deploy Hugo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.167.0"
  HUGO_ENVIRONMENT: production
  TZ: Asia/Dhaka

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Hugo Extended
        run: |
          curl --fail --location \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/hugo.tar.gz"
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Build website
        run: |
          hugo version
          hugo --gc --minify \
            --baseURL "https://naiemurrahmanriyad.github.io/" \
            --destination "${RUNNER_TEMP}/hugo-public"
        working-directory: ./riyad-portfolio

      - name: Publish generated site to the Pages branch
        run: |
          rsync --archive --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/riyad-portfolio/' \
            --exclude='/README.md' \
            "${RUNNER_TEMP}/hugo-public/" "${GITHUB_WORKSPACE}/"
          touch "${GITHUB_WORKSPACE}/.nojekyll"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Generated site is already up to date."
          else
            git commit -m "Publish Hugo site"
            git push
          fi
