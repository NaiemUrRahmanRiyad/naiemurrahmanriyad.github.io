<header class="header" id="header">
  <div class="container nav-wrap">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Riyad home">
      R<span>.</span>
    </a>
    <button id="menuToggle" class="icon-button menu-toggle"
            type="button" aria-label="Open navigation"
            aria-controls="navigation" aria-expanded="false">
      <span></span><span></span>
    </button>
    <nav id="navigation" aria-label="Main navigation">
      {{ range site.Menus.main }}
      <a href="{{ printf "%s%s" site.Home.RelPermalink .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
